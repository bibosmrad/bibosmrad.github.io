<!doctype html>
<html lang="hr">
  <head>
    <title>Hrvatska Wordle tražilica</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta charset="UTF-8" />
    <meta name="author" content="Laura" />
    <meta name="description" content="Hrvatska Wordle tražilica" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta property="og:title" content="Hrvatska Wordle tražilica" />
    <meta property="og:description" content="Hrvatska Wordle tražilica" />
    <meta property="og:image" content="(custom)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hrvatska Wordle tražilica" />
    <meta property="og:locale" content="hr_HR" />
    <link rel="stylesheet" href="assets/css/styles.css" type="text/css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header></header>
    <main>
      <section class="hero">
        <div class="container">
          <h1>Hrvatska Wordle tražilica</h1>
          <p>Ova tražilica pomaže u pronalaženju riječi za igru Wordle.</p>
        </div>
      </section>

      <section class="search">
        <div class="container">
          <div class="row">
            <div class="md:col-6 col-12">
              <form>
                <div class="correct-letters">
                  <p class="mb-xs pb-0">Točna slova na točnom mjestu</p>
                  <div class="input-row">
                    <input
                      data-position="1"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                    <input
                      data-position="2"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                    <input
                      data-position="3"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                    <input
                      data-position="4"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                    <input
                      data-position="5"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                  </div>
                </div>
                <div class="misplaced-letters">
                  <p class="mt-sm mb-xs pb-0">Točna slova na krivom mjestu</p>
                  <div class="input-row" data-row="1">
                    <input
                      data-position="1"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                    <input
                      data-position="2"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                    <input
                      data-position="3"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                    <input
                      data-position="4"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                    <input
                      data-position="5"
                      class="letter-input"
                      type="text"
                      maxlength="2"
                    />
                  </div>
                  <button
                    type="button"
                    class="btn-plus mt-xs"
                    id="new-misplaced-row"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="feather feather-plus-circle"
                    >
                      <circle cx="12" cy="12" r="10"></circle>
                      <line x1="12" y1="8" x2="12" y2="16"></line>
                      <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <span>Dodaj novi red</span>
                  </button>
                </div>
                <div class="absent-letters">
                  <p class="mt-sm mb-xs pb-0">Netočna slova</p>
                  <div class="input-row">
                    <input class="letter-input" type="text" maxlength="2" />
                    <input class="letter-input" type="text" maxlength="2" />
                    <input class="letter-input" type="text" maxlength="2" />
                    <input class="letter-input" type="text" maxlength="2" />
                    <input class="letter-input" type="text" maxlength="2" />
                    <input class="letter-input" type="text" maxlength="2" />
                    <input class="letter-input" type="text" maxlength="2" />
                    <input class="letter-input" type="text" maxlength="2" />
                  </div>
                  <button
                    type="button"
                    class="btn-plus mt-xs"
                    id="new-absent-row"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="feather feather-plus-circle"
                    >
                      <circle cx="12" cy="12" r="10"></circle>
                      <line x1="12" y1="8" x2="12" y2="16"></line>
                      <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <span>Dodaj novi red</span>
                  </button>
                </div>
                <div>
                  <button type="submit" class="btn-solid mt-sm">
                    Pretraži
                  </button>
                </div>
              </form>
            </div>
            <div class="md:col-6 col-12">
              <h2 class="as-h4">Ponuđene riječi:</h2>
              <ul class="results-list"></ul>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
    <script src="assets/script/main.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
